#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nutwatch"
name = "nutwatch"
description.en = "Self-hosted web dashboard to monitor and manage NUT (Network UPS Tools) UPS devices"
description.fr = "Tableau de bord de gestion d'onduleurs"

version = "1.3.0~ynh1"

maintainers = ["otm33GH"]

[upstream]
license = "MIT"
admindoc = "https://github.com/JuanCF/nutwatch"
userdoc = "https://github.com/JuanCF/nutwatch"
code = "https://github.com/JuanCF/nutwatch"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/nutwatch"

    [install.init_main_permission]
    type = "group"
    default = "admins"

    [install.admin]
    type = "user"
    help.en = "Admin user (must be member of the admins group)"
    help.fr = "Compte administrateur (doit être membre du groupe admins)"
    
    [install.password]
    help.en = "Choose admin user password"
    help.fr = "Choisissez le mot de passe du compte d'administration"
    type = "password"
   
        
[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/JuanCF/nutwatch/archive/refs/tags/v1.3.0.tar.gz"
    sha256 = "7e452b23eece1cf1a2949d96c55eeddd4c36ba432fb4cbbd0fa13f31b030dbbc"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]


    [resources.permissions]
    main.url = "/"
    mail.allowed = "admins"
    
    [resources.ports]
    main.default = 8081
    ups.default = 3493

    [resources.apt]
    packages = "nut-server nut-client usbutils python3 python3-venv"

    [resources.nodejs]
    version = "24"
